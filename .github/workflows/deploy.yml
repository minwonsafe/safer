# 특이민원 원터치 대응: 검사 통과해야 배포 (하나라도 실패하면 배포 중단, 기존 화면 유지)
name: 검사 후 배포
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 배포 전 검사 (설치 조건·화면 비례·데이터·삭제 문구)
        run: node tests/check_app.js
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 배포 파일만 모으기 (tests·.github·README 제외)
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'tests' --exclude '_site' --exclude 'README.md' ./ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
