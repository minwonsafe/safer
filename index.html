<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#12315C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="민원세이프">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>민원세이프 - 특이민원 원터치 대응</title>
<style>
/* ══════════ v1.4 화면 비례 — 법ON 방식 ══════════
   모든 크기를 rem(글자 기준값의 배수)으로 지정하고 기준값을 화면 폭에 연동.
   100vw/24.375 = 390px 폭에서 정확히 16px(=v1.3과 동일). 13~18px 범위(약 317~439px 구간 비례) */
html{font-size:clamp(13px,calc(100vw / 24.375),18px);-webkit-text-size-adjust:100%;text-size-adjust:100%}

:root{
  --navy:#12315C; --navy-deep:#0B1F3D; --navy-soft:#E8EDF5;
  --amber:#9A5C00; --amber-soft:#FFF3E0;
  --red:#B3261E; --red-soft:#FCEAE8;
  --teal:#0B6E6D; --teal-soft:#E3F1F0;
  --bg:#F3F4F7; --card:#FFFFFF; --line:#DDE2EA;
  --ink:#14171C; --ink-mid:#434B5A; --ink-soft:#586070;
  --tc:#12315C; --ts:#E8EDF5;
}
.th-navy{--tc:#12315C;--ts:#E8EDF5}
.th-blue{--tc:#2463B5;--ts:#EAF1FB}
.th-orange{--tc:#B34E17;--ts:#FCEFE6}
.th-magenta{--tc:#9C3D7A;--ts:#F7EAF2}
.th-red{--tc:#B3261E;--ts:#FCEAE8}
.th-purple{--tc:#6B4FA0;--ts:#F0ECF8}
.th-teal{--tc:#0B6E6D;--ts:#E3F1F0}
.th-brown{--tc:#A5502A;--ts:#F8ECE5}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  font-size:1.0625rem;line-height:1.6;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:break-word}
#app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg);
  padding-bottom:calc(1.75rem + env(safe-area-inset-bottom))}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
.ic{width:1.5rem;height:1.5rem;flex:0 0 auto;display:block}

/* ── 상단바 ── */
.topbar{background:var(--tc);color:#fff;height:calc(4rem + env(safe-area-inset-top));padding:calc(0.8125rem + env(safe-area-inset-top)) 1.125rem 0.8125rem;
  display:flex;align-items:center;gap:0.625rem;position:sticky;top:0;z-index:20}
.topbar .back{width:2.375rem;height:2.375rem;margin-left:-0.5rem;border-radius:0.625rem;display:flex;align-items:center;justify-content:center;font-size:1.625rem;line-height:1}
.topbar .back:active{background:rgba(255,255,255,.18)}
.topbar h1{margin:0;font-size:1.15625rem;font-weight:800;letter-spacing:-.025em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .org{font-size:0.78125rem;opacity:.75;font-weight:600}
/* v1.4.1 상황 상세: 색 띠 제목이 상단바 밑으로 가려지면 상단바에 제목 표시 */
.topbar h1 .t1{display:none}
.topbar.scrolled h1 .t0{display:none}
.topbar.scrolled h1 .t1{display:inline;animation:tfade .18s ease-out}
@keyframes tfade{from{opacity:0;transform:translateY(0.25rem)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.topbar.scrolled h1 .t1{animation:none}}

/* ── 홈 ── */
.brandbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:0.625rem;
  height:calc(3.625rem + env(safe-area-inset-top));padding:calc(0.5625rem + env(safe-area-inset-top)) 1.125rem 0.5625rem;
  background:#fff;border-bottom:1px solid var(--line)}
.brandapp{flex:1;min-width:0;font-size:1.15625rem;font-weight:800;letter-spacing:-.035em;color:var(--navy);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandorg{flex:0 0 auto;display:flex;align-items:center;gap:0.375rem;font-size:0.78125rem;font-weight:700;
  color:var(--ink-mid);letter-spacing:-.02em;white-space:nowrap}
.govmark{width:1.3125rem;height:1.3125rem;flex:0 0 1.3125rem;object-fit:contain}
.hero{background:var(--navy);color:#fff;padding:1.5rem 1.25rem 2rem}
.hero h2{margin:0 0 0.5rem;font-size:1.75rem;font-weight:800;letter-spacing:-.035em;line-height:1.25}
.hero p{margin:0;font-size:0.96875rem;opacity:.85;line-height:1.55}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;padding:1.125rem 1rem 0.375rem;margin-top:-0.875rem}
.mtile{position:relative;background:var(--tc);color:#fff;border-radius:1.25rem;padding:1.25rem 1rem 1.125rem;text-align:left;
  min-height:12.25rem;display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:0 6px 16px -8px rgba(16,24,40,.45);transition:transform .12s ease;overflow:hidden}
.mtile:active{transform:scale(.97)}
.mtile .bub{width:3.875rem;height:3.875rem;border-radius:1.125rem;background:rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center}
.mtile .bub .ic{width:2.125rem;height:2.125rem}
.mtile b{display:block;font-size:1.28125rem;font-weight:800;letter-spacing:-.035em;line-height:1.3;margin-top:0.875rem}
.mtile small{display:block;font-size:0.84375rem;opacity:1;margin-top:0.3125rem;line-height:1.45;font-weight:500}
.mtile::after{content:"";position:absolute;right:-1.625rem;bottom:-1.625rem;width:6rem;height:6rem;border-radius:50%;background:rgba(255,255,255,.08)}
.hlink{display:flex;align-items:center;gap:0.625rem;width:calc(100% - 2rem);margin:0.625rem 1rem 0;background:var(--card);
  border:1px solid var(--line);border-radius:0.875rem;padding:0.875rem 1rem;font-size:0.96875rem;font-weight:700;color:var(--ink-mid)}
.hlink .ic{width:1.375rem;height:1.375rem;color:var(--navy)}
.hlink:active{background:#F7F8FA}
.hlink .arrow{margin-left:auto;color:#B9C0CC;font-size:1.25rem}

.wrap{padding:1.125rem 1rem}
.foot{padding:1.125rem 1.25rem 0;font-size:0.78125rem;color:var(--ink-soft);line-height:1.7;text-align:center}

/* ── 서브탭 ── */
.stabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:0.375rem;background:#fff;border-bottom:1px solid var(--line);
  padding:0.625rem 0.75rem;position:sticky;top:calc(4rem + env(safe-area-inset-top));z-index:15}
.stab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.25rem;border-radius:0.8125rem;padding:0.625rem 0.25rem 0.5625rem;
  font-size:0.90625rem;font-weight:800;color:var(--ink-soft);background:#EFF1F5;white-space:nowrap;letter-spacing:-.02em;min-width:0}
.stab .ic{width:1.375rem;height:1.375rem}
.stab.on{background:var(--tc);color:#fff;box-shadow:0 3px 8px -3px rgba(16,24,40,.35)}

/* ── 상황 목록 ── */
.srow{width:100%;display:flex;align-items:center;gap:0.875rem;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:1rem;padding:1rem;margin-bottom:0.625rem;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.srow:active{background:#FAFBFC}
.srow .pic{width:3.375rem;height:3.375rem;flex:0 0 3.375rem;border-radius:0.9375rem;background:var(--ts);color:var(--tc);
  display:flex;align-items:center;justify-content:center}
.srow .pic .ic{width:1.875rem;height:1.875rem}
.srow .tx{flex:1;min-width:0}
.srow .tx b{display:block;font-size:1.125rem;font-weight:800;letter-spacing:-.025em;line-height:1.35}
.srow .tx small{display:block;font-size:0.875rem;color:var(--ink-soft);margin-top:0.1875rem;font-weight:500}
.srow .arrow{color:#B9C0CC;font-size:1.375rem}
.srow.urgent{background:var(--red-soft);border-color:#EBB8B3}
.srow.urgent .pic{background:var(--red);color:#fff}
.srow.urgent .tx b{color:var(--red)}
.srow.urgent .tx small{color:#94403A}

/* ── 상황 상세 ── */
.band{background:var(--tc);color:#fff;padding:0.375rem 1.25rem 1.5rem;display:flex;align-items:center;gap:1rem}
.band .bic{width:4.125rem;height:4.125rem;flex:0 0 4.125rem;border-radius:1.25rem;background:rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center}
.band .bic .ic{width:2.375rem;height:2.375rem}
.band h2{margin:0;font-size:1.4375rem;font-weight:800;letter-spacing:-.035em;line-height:1.3}
.band p{margin:0.25rem 0 0;font-size:0.9375rem;opacity:1;font-weight:600}

.blk{margin-bottom:1.625rem}
.blk-h{display:flex;align-items:center;gap:0.5625rem;margin:0 0.125rem 0.6875rem}
.blk-h .n{width:1.625rem;height:1.625rem;flex:0 0 1.625rem;border-radius:0.5rem;background:var(--tc);color:#fff;
  font-size:0.875rem;font-weight:800;display:flex;align-items:center;justify-content:center}
.blk-h b{font-size:1.1875rem;font-weight:800;letter-spacing:-.03em}

.say{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1.0625rem 1.0625rem 0.9375rem;margin-bottom:0.6875rem}
.say .cap{font-size:0.8125rem;font-weight:800;color:var(--ink-soft);margin-bottom:0.5rem;letter-spacing:-.01em}
.say .q{font-size:1.1875rem;font-weight:700;letter-spacing:-.025em;line-height:1.62;color:var(--ink)}
.say .q::before{content:"\201C"} .say .q::after{content:"\201D"}
.say.warn{border-left:5px solid var(--amber);background:var(--amber-soft)}
.say.end{border-left:5px solid var(--red);background:var(--red-soft)}
.copy{margin-top:0.75rem;width:100%;border:1px solid var(--line);background:#fff;border-radius:0.6875rem;
  padding:0.75rem;font-size:0.9375rem;font-weight:700;color:var(--tc)}
.copy:active{background:#F2F5FA}

.acts{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:0.375rem 1.0625rem}
.acts div{font-size:1.03125rem;color:var(--ink-mid);padding:0.8125rem 0;border-bottom:1px solid #EEF0F4;display:flex;gap:0.625rem;line-height:1.55}
.acts div:last-child{border-bottom:0}
.acts div::before{content:"";flex:0 0 0.5rem;height:0.5rem;border-radius:50%;background:var(--tc);margin-top:0.5625rem}
.acts b{color:var(--ink)}

/* ── 전화기 사진 ── */
.ppanel{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:0.8125rem;margin-bottom:0.6875rem}
.ptog{display:flex;gap:0.375rem;background:#EFF1F5;border-radius:0.75rem;padding:0.25rem;margin-bottom:0.6875rem}
.ptog button{flex:1;border-radius:0.5625rem;padding:0.625rem 0.375rem;font-size:0.90625rem;font-weight:800;color:var(--ink-soft)}
.ptog button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.14)}
.shot{position:relative;border-radius:0.625rem;overflow:hidden;background:#fff;container-type:inline-size}
.shot img{display:block;width:100%;height:auto}
.shot .spot{position:absolute;inset:0;pointer-events:none}
.shot .ring{position:absolute;width:1.625rem;height:1.625rem;margin:-0.8125rem 0 0 -0.8125rem;
  width:7.4cqw;height:7.4cqw;margin:-3.7cqw 0 0 -3.7cqw;border-radius:50%;
  border:2.5px solid #FF2D20;animation:pulse 1.6s ease-out infinite;pointer-events:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,45,32,.55)}70%{box-shadow:0 0 0 8px rgba(255,45,32,0)}100%{box-shadow:0 0 0 0 rgba(255,45,32,0)}}
.kchips{display:flex;flex-wrap:wrap;gap:0.5rem;margin-top:0.75rem}
.kchip{flex:1 1 auto;border:1.5px solid var(--line);background:#fff;border-radius:0.75rem;padding:0.6875rem 0.75rem;
  font-size:0.9375rem;font-weight:700;color:var(--ink-mid);text-align:left}
.kchip b{display:inline-flex;width:1.5rem;height:1.5rem;border-radius:0.4375rem;background:#EFF1F5;color:var(--ink);
  align-items:center;justify-content:center;font-size:0.875rem;margin-right:0.375rem;vertical-align:-0.125rem}
.kchip.on{border-color:var(--red);background:var(--red-soft);color:var(--ink)}
.kchip.on b{background:var(--red);color:#fff}

button.keyrow{width:100%;display:flex;gap:0.875rem;align-items:center;text-align:left;background:#fff;
  border:1.5px solid var(--line);border-radius:0.875rem;padding:0.9375rem 1rem;margin-bottom:0.625rem}
button.keyrow .n{width:2.25rem;height:2.25rem;flex:0 0 2.25rem;border-radius:0.625rem;background:var(--navy);color:#fff;
  font-size:1.125rem;font-weight:800;display:flex;align-items:center;justify-content:center}
button.keyrow .tx b{display:block;font-size:1.0625rem;font-weight:800}
button.keyrow .tx small{display:block;font-size:0.90625rem;color:var(--ink-mid);margin-top:0.1875rem;line-height:1.55}
button.keyrow.on{border-color:var(--red);background:var(--red-soft)}
button.keyrow.on .n{background:var(--red)}

/* ── 법조 ── */
.lawrow{width:100%;display:flex;align-items:center;gap:0.8125rem;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:0.9375rem;padding:0.9375rem 1rem;margin-bottom:0.5625rem}
.lawrow:active{background:#FAFBFC}
.lawrow .no{width:2.125rem;height:2.125rem;flex:0 0 2.125rem;border-radius:0.625rem;background:var(--ts);color:var(--tc);
  font-size:0.9375rem;font-weight:800;display:flex;align-items:center;justify-content:center}
.lawrow .tx{flex:1;min-width:0}
.lawrow .tx b{display:block;font-size:1.09375rem;font-weight:800;letter-spacing:-.02em}
.lawrow .tx small{display:block;font-size:0.875rem;color:var(--ink-soft);margin-top:0.125rem;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lawrow .arrow{color:#B9C0CC;font-size:1.3125rem}
.pen{background:#fff;border:1px solid var(--line);border-left:5px solid var(--tc);border-radius:0.875rem;padding:0.9375rem 1rem;margin-bottom:0.625rem}
.pen .ref{font-size:1rem;font-weight:800;color:var(--tc);letter-spacing:-.015em}
.pen .amt{font-size:1.0625rem;color:var(--ink);margin-top:0.375rem;line-height:1.55;font-weight:600}
.pr{margin-top:0.6875rem;padding-top:0.625rem;border-top:1px dashed var(--line);font-size:0.90625rem;line-height:1.6;color:var(--ink-mid)}
.pr b{display:inline-block;font-size:0.78125rem;font-weight:800;border-radius:0.375rem;padding:0.1875rem 0.5rem;margin-right:0.375rem}
.pr-chingo b{background:var(--red-soft);color:var(--red)}
.pr-bansa b{background:var(--amber-soft);color:var(--amber)}
.pr-none b{background:var(--teal-soft);color:var(--teal)}

/* ── 사례 ── */
.case{background:var(--card);border:1px solid var(--line);border-radius:1rem;overflow:hidden;margin-bottom:0.8125rem}
.case .ch{display:flex;align-items:center;gap:0.6875rem;background:var(--ts);padding:0.875rem 1rem}
.case .ch .no{width:2rem;height:2rem;flex:0 0 2rem;border-radius:0.625rem;background:var(--tc);color:#fff;
  font-size:1rem;font-weight:800;display:flex;align-items:center;justify-content:center}
.case .ch h4{margin:0;font-size:1.125rem;font-weight:800;letter-spacing:-.025em;color:var(--ink)}
.case .cb{padding:0.9375rem 1rem 0.875rem}
.case .w{font-size:1rem;color:var(--ink-mid);line-height:1.65;margin-bottom:0.75rem}
.case .r{display:flex;gap:0.4375rem;flex-wrap:wrap;margin-bottom:0.75rem}
.case .r span{font-size:0.875rem;font-weight:800;border-radius:0.5rem;padding:0.375rem 0.6875rem}
.case .r .c{background:var(--navy-soft);color:var(--navy)}
.case .r .p{background:var(--red-soft);color:var(--red)}
.case .n{font-size:0.96875rem;color:var(--ink-mid);background:#F6F7F9;border-radius:0.6875rem;padding:0.75rem 0.8125rem;line-height:1.65}
.case .n b{color:var(--ink)}

/* ── 카드 그림자 통일 ── */
.art,.say,.acts,.case,.note,.pen,.rec,.keep,.ppanel,.srow,.lawrow,.hlink{box-shadow:0 6px 18px -18px rgba(16,31,55,.55)}

/* ── 공통 카드 ── */
.art{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1.125rem 1.125rem 1rem;margin-bottom:0.8125rem}
.art h3{margin:0 0 0.75rem;font-size:1.1875rem;font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap}
.art h3 .pill{font-size:0.78125rem;font-weight:800;background:var(--ts);color:var(--tc);border-radius:0.4375rem;padding:0.1875rem 0.5625rem}
.art ul{margin:0;padding-left:1.1875rem}
.art li{font-size:1.03125rem;color:var(--ink-mid);margin-bottom:0.5625rem;line-height:1.65}
.art li b{color:var(--ink)}
.src{font-size:0.78125rem;color:var(--ink-soft);margin-top:0.75rem;padding-top:0.625rem;border-top:1px solid var(--line)}
.hhead{display:flex;align-items:center;gap:0.75rem;background:var(--ts);border-radius:1rem;padding:0.9375rem 1rem;margin-bottom:0.875rem}
.hhead .hi{width:3rem;height:3rem;flex:0 0 3rem;border-radius:0.875rem;background:var(--tc);color:#fff;display:flex;align-items:center;justify-content:center}
.hhead .hi .ic{width:1.75rem;height:1.75rem}
.hhead b{font-size:1.1875rem;font-weight:800;letter-spacing:-.03em;color:var(--tc)}

ol.flow{margin:0;padding:0;list-style:none;counter-reset:f}
ol.flow li{counter-increment:f;position:relative;padding:0 0 1.0625rem 2.375rem;border-left:2px solid var(--ts);margin-left:0.75rem}
ol.flow li:last-child{border-left-color:transparent;padding-bottom:0}
ol.flow li::before{content:counter(f);position:absolute;left:-0.875rem;top:0;width:1.625rem;height:1.625rem;
  border-radius:50%;background:var(--tc);color:#fff;font-size:0.8125rem;font-weight:800;display:flex;align-items:center;justify-content:center}
ol.flow li b{font-size:1.0625rem;font-weight:800}
ol.flow li span{font-size:0.78125rem;font-weight:800;color:var(--tc);background:var(--ts);border-radius:0.375rem;padding:0.125rem 0.5rem;margin-left:0.375rem}
ol.flow li i{display:block;font-style:normal;font-size:0.96875rem;color:var(--ink-mid);margin-top:0.3125rem;line-height:1.6}

.note{background:#fff;border:1px solid var(--line);border-radius:0.875rem;padding:0.875rem 1rem;
  font-size:0.96875rem;color:var(--ink-mid);line-height:1.7;margin-bottom:0.8125rem}
.note b{color:var(--ink)}
.note.warnbox{background:var(--amber-soft);border-color:#EBCFA6}

/* ── 버튼 ── */
.btn{width:100%;border-radius:0.875rem;padding:1.0625rem;font-size:1.09375rem;font-weight:800;letter-spacing:-.02em;margin-bottom:0.625rem}
.btn-main{background:var(--tc);color:#fff}
.btn-main:active{filter:brightness(.9)}
.btn-stop{background:var(--red);color:#fff}
.btn-stop:active{filter:brightness(.9)}
.btn-line{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn-line:active{background:#F5F6F8}
.btn-warnline{background:#fff;color:var(--amber);border:1.5px solid #EBCFA6}
.btn-warnline:active{background:var(--amber-soft)}
.btn-sm{padding:0.9375rem;font-size:1rem}

/* ── 선택 시트 ── */
.sheet{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center}
.sh-back{position:absolute;inset:0;background:rgba(12,18,30,.45)}
.sh-box{position:relative;width:100%;max-width:560px;background:#fff;border-radius:1.375rem 1.375rem 0 0;
  padding:1.375rem 1.125rem calc(0.875rem + env(safe-area-inset-bottom));box-shadow:0 -10px 30px -10px rgba(0,0,0,.3)}
.sh-t{display:block;font-size:1.1875rem;font-weight:800;letter-spacing:-.03em;margin-bottom:0.375rem}
.sh-d{margin:0 0 1rem;font-size:0.96875rem;color:var(--ink-mid);line-height:1.6}
.sh-h{color:var(--ink);font-weight:700}

/* ── 통화 중 표시 ── */
.livepill{position:fixed;left:50%;bottom:calc(1.125rem + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;
  display:flex;align-items:center;gap:0.5625rem;background:var(--red);color:#fff;border-radius:6.1875rem;padding:0.75rem 1.25rem;
  font-size:1rem;font-weight:800;box-shadow:0 8px 22px -6px rgba(179,38,30,.6);font-variant-numeric:tabular-nums}
.livepill i{width:0.625rem;height:0.625rem;border-radius:50%;background:#fff;animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}

/* ── 타이머 ── */
.stage{padding:1.75rem 1.125rem 1.5rem;text-align:center;transition:background .45s ease}
.stage-run{background:var(--navy);color:#fff}
.stage-warn{background:var(--amber);color:#fff}
.stage-over{background:var(--red);color:#fff}
.stage-idle{background:var(--navy-deep);color:#fff}
.stage .label{display:inline-block;font-size:0.8125rem;font-weight:800;letter-spacing:.03em;
  background:rgba(0,0,0,.2);border-radius:62.4375rem;padding:0.375rem 0.875rem;margin-bottom:0.875rem}
.clock{font-size:4.125rem;font-weight:800;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.stage .since{font-size:0.875rem;opacity:1;font-weight:600;margin-top:0.625rem}
.track{height:0.375rem;border-radius:6.1875rem;background:rgba(255,255,255,.24);margin:1.125rem 0.25rem 0;overflow:hidden}
.track i{display:block;height:100%;background:#fff;border-radius:6.1875rem;width:0;transition:width .5s linear}
.ticks{display:flex;justify-content:space-between;font-size:0.78125rem;font-weight:700;margin:0.4375rem 0.3125rem 0}
.keep{display:flex;align-items:center;gap:0.75rem;background:var(--card);border:1px solid var(--line);border-radius:0.875rem;padding:0.9375rem 1rem;margin-bottom:0.75rem}
.keep .tx{flex:1}
.keep .tx b{display:block;font-size:1rem;font-weight:800}
.keep .tx small{display:block;font-size:0.84375rem;color:var(--ink-soft);margin-top:0.125rem}
.sw{width:3.25rem;height:1.9375rem;flex:0 0 3.25rem;border-radius:6.1875rem;background:#D3D8E0;position:relative;transition:background .2s}
.sw i{position:absolute;top:0.1875rem;left:0.1875rem;width:1.5625rem;height:1.5625rem;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:var(--teal)} .sw.on i{transform:translateX(1.3125rem)}
.rec{background:var(--card);border:1px solid var(--line);border-radius:0.875rem;padding:0.9375rem 1rem;margin-bottom:0.625rem}
.rec .top{display:flex;justify-content:space-between;align-items:baseline;gap:0.625rem}
.rec .dur{font-size:1.25rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.rec .why{font-size:0.78125rem;font-weight:800;border-radius:0.4375rem;padding:0.25rem 0.5625rem;white-space:nowrap}
.why-norm{background:var(--navy-soft);color:var(--navy)}
.why-time{background:var(--amber-soft);color:var(--amber)}
.why-abuse{background:var(--red-soft);color:var(--red)}
.rec .when{font-size:0.875rem;color:var(--ink-soft);margin-top:0.3125rem}
.empty{text-align:center;color:var(--ink-soft);font-size:0.9375rem;padding:2.75rem 1.25rem;line-height:1.75}

/* ── 발생보고서 ── */
.steps{background:#fff;border-bottom:1px solid var(--line);padding:0.875rem 1.125rem 0.9375rem;position:sticky;top:calc(4rem + env(safe-area-inset-top));z-index:15}
.steps .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:0.625rem}
.steps .row b{font-size:1.0625rem;font-weight:800;letter-spacing:-.02em}
.steps .row span{font-size:0.84375rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.steps .bar{height:0.3125rem;border-radius:6.1875rem;background:#E7EAEF;overflow:hidden}
.steps .bar i{display:block;height:100%;background:var(--navy);border-radius:6.1875rem;transition:width .3s ease}
.fld{margin-bottom:1.1875rem}
.fld label{display:block;font-size:1rem;font-weight:800;margin-bottom:0.5rem}
.fld .hint{font-size:0.875rem;color:var(--ink-soft);font-weight:500;margin-top:-0.1875rem;margin-bottom:0.5rem;line-height:1.6}
.fld input[type=text], .fld input[type=datetime-local], .fld textarea{width:100%;border:1.5px solid var(--line);border-radius:0.75rem;background:#fff;
  padding:0.875rem;font-size:1.0625rem;font-family:inherit;color:var(--ink);line-height:1.5}
.fld textarea{min-height:7.5rem;resize:vertical}
.fld input:focus, .fld textarea:focus{outline:2px solid var(--navy);outline-offset:-1px;border-color:var(--navy)}
.chips{display:flex;flex-wrap:wrap;gap:0.5rem}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:6.1875rem;padding:0.6875rem 0.9375rem;font-size:0.96875rem;font-weight:700;color:var(--ink-mid)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip:active{transform:scale(.96)}
.opt{width:100%;display:flex;align-items:center;gap:0.75rem;text-align:left;border:1.5px solid var(--line);
  background:#fff;border-radius:0.75rem;padding:0.875rem 0.9375rem;margin-bottom:0.5rem;font-size:1.03125rem;font-weight:700;color:var(--ink-mid)}
.opt .dot{width:1.3125rem;height:1.3125rem;flex:0 0 1.3125rem;border-radius:50%;border:2px solid #C9CFD9;position:relative}
.opt.on{border-color:var(--navy);background:#F5F8FD;color:var(--ink)}
.opt.on .dot{border-color:var(--navy)}
.opt.on .dot::after{content:"";position:absolute;inset:0.1875rem;border-radius:50%;background:var(--navy)}
.navrow{display:flex;gap:0.5625rem;margin-top:1.5rem}
.navrow .btn{margin-bottom:0}
.navrow .btn-line{flex:0 0 6.25rem}
.tag{display:inline-block;font-size:0.8125rem;font-weight:800;border-radius:0.4375rem;padding:0.25rem 0.625rem;margin:0 0.3125rem 0.3125rem 0}
.tag-illegal{background:var(--red-soft);color:var(--red)}
.tag-unfair{background:var(--amber-soft);color:var(--amber)}
.out{background:#fff;border:1px solid var(--line);border-radius:0.875rem;padding:1.0625rem;font-size:0.90625rem;line-height:1.85;color:var(--ink);white-space:pre-wrap;word-break:break-word}
.chk{display:flex;gap:0.625rem;align-items:flex-start;font-size:0.96875rem;color:var(--ink-mid);margin-bottom:0.5625rem;line-height:1.55}
.chk .m{flex:0 0 1.125rem;font-weight:800}
.chk .yes{color:var(--teal)} .chk .no{color:var(--ink-soft)} .chk .idk{color:var(--amber)}

/* ── 인쇄 ── */
.pmode{display:flex;gap:0.5625rem;margin-bottom:1rem}
.pmode button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:0.8125rem;padding:0.9375rem 0.625rem;font-size:0.96875rem;font-weight:800;color:var(--ink-soft)}
.pmode button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.paper{background:#fff;border:1px solid var(--line);border-radius:0.75rem;padding:1.125rem;font-size:0.78125rem;line-height:1.6}
.paper h2{margin:0 0 0.25rem;font-size:1.0625rem;font-weight:800;letter-spacing:-.02em}
.paper .sub{font-size:0.71875rem;color:var(--ink-soft);margin-bottom:0.875rem;padding-bottom:0.625rem;border-bottom:2px solid var(--navy)}
.paper h3{margin:0.875rem 0 0.4375rem;font-size:0.84375rem;font-weight:800;color:var(--navy);padding-left:0.4375rem;border-left:3px solid var(--navy)}
.paper .row{display:flex;gap:0.5rem;padding:0.25rem 0;border-bottom:1px solid #F0F2F5}
.paper .row:last-child{border-bottom:0}
.paper .row .l{flex:0 0 4.875rem;font-weight:700;color:var(--ink)}
.paper .row .r{flex:1;color:var(--ink-mid)}
.paper .say2{padding:0.3125rem 0;border-bottom:1px solid #F0F2F5}
.paper .say2 .c{font-size:0.6875rem;font-weight:700;color:var(--ink-soft)}
.paper .say2 .q{color:var(--ink);margin-top:0.125rem}
.paper table{width:100%;border-collapse:collapse;font-size:0.71875rem}
.paper th,.paper td{border:1px solid var(--line);padding:0.3125rem 0.375rem;text-align:left;vertical-align:top}
.paper th{background:#F4F6F9;font-weight:700;font-size:0.6875rem}
.paper .pfoot{margin-top:0.875rem;padding-top:0.5625rem;border-top:1px solid var(--line);font-size:0.65625rem;color:var(--ink-soft)}
.ks-imgs{display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;align-items:start}

.toast{position:fixed;left:50%;bottom:5.625rem;transform:translate(-50%,0.875rem);background:rgba(17,20,25,.93);color:#fff;
  font-size:0.9375rem;font-weight:700;padding:0.8125rem 1.3125rem;border-radius:0.75rem;opacity:0;pointer-events:none;
  transition:opacity .22s ease, transform .22s ease;z-index:90}
.toast.on{opacity:1;transform:translate(-50%,0)}


/* ══════════ v1.3 질감 레이어 — 색·배치·크기·글자는 그대로, 표면만 다듬음 ══════════
   color-mix() 미사용: 배경색은 그대로 두고 반투명 흰색/검정 그라데이션을 겹쳐 입체감을 냄 */
:root{
  --elev-1:0 1px 2px rgba(13,29,53,.05),0 8px 22px -8px rgba(13,29,53,.10);
  --elev-2:0 2px 5px rgba(13,29,53,.08),0 18px 30px -14px rgba(13,29,53,.45);
  --gloss:linear-gradient(155deg,rgba(255,255,255,.12) 0%,rgba(255,255,255,.03) 45%,rgba(0,0,0,.07) 100%);
}
body{background:linear-gradient(180deg,#F6F7FA 0%,#F1F3F6 55%,#F4F5F8 100%)}
#app{background:transparent}

/* 기관 바 — 구성 유지, 반투명 바탕과 얇은 그림자만 */
.brandbar{background:rgba(255,255,255,.94);backdrop-filter:saturate(160%) blur(16px);-webkit-backdrop-filter:saturate(160%) blur(16px);
  border-bottom-color:rgba(18,49,92,.09);box-shadow:0 8px 18px -16px rgba(13,29,53,.45)}

/* 히어로 — 네이비 유지 + 잔잔한 원형 무늬와 명암 */
.hero{position:relative;overflow:hidden;padding:1.75rem 1.25rem 2.375rem;
  background-image:radial-gradient(circle at 72% 80%,rgba(255,255,255,.10) 0 2.2%,transparent 2.5%),
    radial-gradient(circle at 86% 30%,rgba(255,255,255,.05) 0 19%,transparent 19.4%),
    linear-gradient(150deg,rgba(255,255,255,.05) 0%,rgba(0,0,0,.16) 100%)}
.hero::after{content:"";position:absolute;right:-3.75rem;bottom:-6rem;width:13.125rem;height:13.125rem;border-radius:50%;
  border:1px solid rgba(255,255,255,.08);box-shadow:0 0 0 34px rgba(255,255,255,.022),0 0 0 68px rgba(255,255,255,.015)}
.hero h2,.hero p{position:relative;z-index:1}

/* 메인 4버튼 — 색·크기·2×2 유지, 광택·두께·그림자 */
.grid{gap:0.8125rem;margin-top:-1rem}
.mtile{isolation:isolate;border-radius:1.375rem;min-height:12.5rem;border:1px solid rgba(255,255,255,.16);
  background-image:var(--gloss);box-shadow:var(--elev-2)}
.mtile::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,0) 42%)}
.mtile::after{right:-2.125rem;bottom:-2.5rem;width:8.125rem;height:8.125rem;background:radial-gradient(circle,rgba(255,255,255,.12),rgba(255,255,255,0) 68%)}
.mtile:active{transform:scale(.975);box-shadow:0 6px 16px -8px rgba(13,29,53,.4)}
.mtile .tt{position:relative;z-index:2}
/* 메인 여백 통일 — 네이비→타일, 좌우, 타일 사이, 타일→인쇄 모두 16px */
.grid{margin-top:0;padding:1rem 1rem 0;gap:1rem}
.hlink{margin-top:1rem}
.hero{padding-bottom:1.875rem}
/* 타일 안 — 내용을 세로 가운데에, 그림 위 여백 = 글자 아래 여백 */
.mtile{justify-content:center;padding:1rem 1rem 1.25rem}
.visual{margin:0 0 0 -0.25rem}
.mtile .tt{margin-top:0.75rem}
.mtile b{margin-top:0}
.visual{width:4.625rem;height:4.625rem;display:block;position:relative;z-index:2;margin:-0.25rem 0 0 -0.25rem;
  filter:drop-shadow(0 8px 9px rgba(4,16,34,.22))}
.visual svg{width:100%;height:100%;display:block;overflow:visible}

/* 서브화면 상단 — 메뉴 색 유지 + 미세한 광택 */
.topbar{background-image:linear-gradient(180deg,rgba(255,255,255,.08) 0%,rgba(255,255,255,0) 70%);
  box-shadow:inset 0 -1px 0 rgba(0,0,0,.06),0 8px 18px -16px rgba(8,25,49,.9)}
.band{position:relative;overflow:hidden;background-image:linear-gradient(155deg,rgba(255,255,255,.07) 0%,rgba(0,0,0,.08) 100%)}
.band::after{content:"";position:absolute;right:-2.75rem;bottom:-5rem;width:10.625rem;height:10.625rem;border-radius:50%;background:rgba(255,255,255,.06)}
.band > *{position:relative;z-index:1}
.band .bic{border-radius:1.3125rem;background:linear-gradient(145deg,rgba(255,255,255,.26),rgba(255,255,255,.10));
  border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 8px 16px -12px rgba(0,0,0,.5)}

/* 서브탭·목록 아이콘 — 선 아이콘 유지(판독 속도), 바탕만 정돈 */
.stabs{background:rgba(255,255,255,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom-color:rgba(17,35,62,.08)}
.stab.on{background-image:var(--gloss);box-shadow:0 6px 12px -8px rgba(16,24,40,.75)}
.srow .pic{background:linear-gradient(145deg,#FFFFFF 0%,var(--ts) 100%);border:1px solid rgba(16,31,55,.05);
  box-shadow:inset 0 1px 0 #fff,0 6px 12px -10px rgba(16,31,55,.5)}
.srow.urgent .pic{background:var(--red) linear-gradient(145deg,rgba(255,255,255,.16),rgba(0,0,0,.08));border-color:transparent}

/* 흰 카드 — 그림자·모서리 통일 (색 테두리가 있는 카드는 테두리색 건드리지 않음) */
.art,.acts,.case,.rec,.keep,.ppanel,.srow,.lawrow,.hlink{border-color:rgba(17,35,62,.09)}
.art,.say,.acts,.case,.note,.pen,.rec,.keep,.ppanel,.srow,.lawrow,.hlink{box-shadow:var(--elev-1)}
.say,.acts,.art,.case,.pen,.note,.ppanel{border-radius:1.125rem}
.srow,.lawrow{border-radius:1.0625rem}
.blk-h .n{border-radius:0.5625rem;box-shadow:0 4px 10px -6px rgba(0,0,0,.45)}
.btn-main,.btn-stop{box-shadow:0 8px 16px -10px rgba(13,29,53,.55)}




/* ── 설정 버튼·창 (v1.6) ── */
.setbtn{position:absolute;top:.875rem;right:.875rem;z-index:2;display:flex;flex-direction:column;align-items:center;gap:.125rem;
  color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:.875rem;padding:.4375rem .5rem .3125rem;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
.setbtn .ic{width:1.375rem;height:1.375rem}
.setbtn span{font-size:.6875rem;font-weight:800;letter-spacing:-.01em;line-height:1}
.setbtn:active{background:rgba(255,255,255,.22)}
.sh-box.set{padding-top:1rem}
.set-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:.375rem}
.set-h b{font-size:1.1875rem;font-weight:800;letter-spacing:-.03em}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.875rem 0;border-top:1px solid #EEF0F4}
.set-row.col{flex-direction:column;align-items:stretch}
.set-l b{display:block;font-size:1rem;font-weight:800}
.set-l small{display:block;font-size:.8125rem;color:var(--ink-soft);margin-top:.125rem}
.seg{flex:0 0 auto;display:flex;background:#EFF1F5;border-radius:.75rem;padding:.25rem;gap:.25rem}
.seg button{border-radius:.5625rem;padding:.5rem .875rem;font-size:.9375rem;font-weight:800;color:var(--ink-soft)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.16)}
.set-note{margin:0;font-size:.9375rem;color:var(--ink-mid);background:#F6F7F9;border-radius:.75rem;padding:.75rem .875rem;line-height:1.6}
.set-note b{color:var(--ink)}

/* ── 글자 크기 '크게' (v1.6) — 기준값 12% 확대. 폭이 빠듯한 기관 바·메인 제목은 보통 크기 유지 ── */
html[data-fs="l"]{font-size:clamp(14.56px,calc(100vw / 21.7634),20.16px)}
html[data-fs="l"] .brandbar{height:calc(3.2366rem + env(safe-area-inset-top));padding:calc(.5022rem + env(safe-area-inset-top)) 1.0045rem .5022rem;gap:.558rem}
html[data-fs="l"] .brandapp{font-size:1.0324rem}
html[data-fs="l"] .brandorg{font-size:.6975rem;gap:.3348rem}
html[data-fs="l"] .govmark{width:1.1719rem;height:1.1719rem;flex-basis:1.1719rem}
html[data-fs="l"] .mtile b{font-size:1.144rem}
html[data-fs="l"] .hero h2{font-size:1.5625rem}
html[data-fs="l"] .visual{width:4.1295rem;height:4.1295rem}
html[data-fs="l"] .grid{padding:.8929rem .8929rem 0;gap:.8929rem}
html[data-fs="l"] .mtile{padding:.8929rem .8929rem 1.1161rem;border-radius:1.2277rem}

/* ── 조치 사항 아이콘 (v1.5) ── */
.acts div.ia{align-items:center;gap:.75rem}
.acts div.ia::before{display:none}
.ai{width:2.375rem;height:2.375rem;flex:0 0 2.375rem;border-radius:.75rem;display:flex;align-items:center;justify-content:center;
  background:var(--ag-s);color:var(--ag);box-shadow:inset 0 0 0 1px rgba(0,0,0,.03)}
.ai .ic{width:1.3125rem;height:1.3125rem}
.g-phone{--ag:#2463B5;--ag-s:#EAF1FB}
.g-evid{--ag:#0B6E6D;--ag-s:#E3F1F0}
.g-report{--ag:#6B4FA0;--ag-s:#F0ECF8}
.g-safety{--ag:#B3261E;--ag-s:#FCEAE8}
.g-resp{--ag:#9A5C00;--ag-s:#FFF3E0}

/* ── 홈 화면 설치 안내 카드 ── */
.inst{display:flex;align-items:center;gap:.75rem;margin:1rem 1rem 0;background:var(--card);border:1px solid rgba(17,35,62,.09);
  border-radius:1rem;padding:.75rem .75rem .75rem .875rem;box-shadow:var(--elev-1)}
.inst .ii{width:2.5rem;height:2.5rem;flex:0 0 2.5rem;border-radius:.75rem;background:var(--navy-soft);color:var(--navy);display:flex;align-items:center;justify-content:center}
.inst .ii .ic{width:1.375rem;height:1.375rem}
.inst .it{flex:1;min-width:0}
.inst .it b{display:block;font-size:.96875rem;font-weight:800;letter-spacing:-.02em}
.inst .it small{display:block;font-size:.8125rem;color:var(--ink-soft);margin-top:.0625rem}
.inst .ib{flex:0 0 auto;background:var(--navy);color:#fff;border-radius:.75rem;padding:.625rem 1rem;font-size:.9375rem;font-weight:800}
.inst .ix{flex:0 0 auto;width:2rem;height:2rem;border-radius:.625rem;color:var(--ink-soft);font-size:1.375rem;line-height:1}
.inst .ix:active{background:#EFF1F5}

/* ══════════ 짧은 화면 대응 (아이폰 SE 등) ══════════ */
@media (max-height:700px){
  .hero{padding-top:1.125rem;padding-bottom:1.25rem}
  .grid{padding-top:.75rem;gap:.75rem}
  .mtile{min-height:11.5rem;padding-top:.75rem;padding-bottom:1rem}
  .visual{width:4rem;height:4rem}
  .hlink{margin-top:.75rem}
  .inst{margin-top:.75rem}
  .stage{padding-top:1.25rem;padding-bottom:1.125rem}
  .clock{font-size:3.625rem}
}

<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
/* ══════════════════════════════════════════
   민원세이프 (특이민원 원터치 대응) — v1.6 · https://minwonsafe.github.io/safer/
   구조: 제안서 V4(2026.9.13.) · '26.9.17 시안 검토 반영
   근거: 고용노동부 「특이민원 예방 및 대응요령」(2025. 8.)
   ══════════════════════════════════════════ */

var WARN_MIN = 15;
var LIMIT_MIN = 20;

var store = (function(){
  var mem={}, ok=false;
  try{ var k='__t'; window.localStorage.setItem(k,'1'); window.localStorage.removeItem(k); ok=true; }catch(e){ ok=false; }
  return {
    get:function(k){ try{ return ok ? window.localStorage.getItem(k) : (mem[k]||null); }catch(e){ return mem[k]||null; } },
    set:function(k,v){ try{ if(ok) window.localStorage.setItem(k,v); else mem[k]=v; }catch(e){ mem[k]=v; } },
    del:function(k){ try{ if(ok) window.localStorage.removeItem(k); else delete mem[k]; }catch(e){ delete mem[k]; } }
  };
})();

var S = {
  view:'home', arg:null,
  tab:'phone', tab2:'flow', from:null, lastSitu:null,
  startAt:null, abuse:false, keepOn:false, wakeLock:null, tick:null, pillTick:null,
  step:1, maxStep:1, pmode:'card',
  phone:(store.get('sm_phone')==='b'?'b':'w'),   // 내 전화기 색상 기억
  kact:null,   // 상황 화면에서 강조 중인 기능버튼
  hiKey:null   // 전화기 화면에서 강조 중인 기능버튼
};

var R = null;
function newReport(){
  S.maxStep=1;
  return { when:'', dur:'', place:'', route:'', acts:[], task:'', words:'',
           q1:'', q2:'', q3:'', ev:[], witness:'', steps:[], want:[] };
}

/* 메인 4개 메뉴 — 검토 반영 명칭 */
var MAIN = {
  situ:{t:'위기 상황 대응', s:'전화통화·대면방문·기타 상황', pic:'alert', th:'th-navy'},
  help:{t:'직원 보호·지원', s:'법률 · 보험 · 심리 · 휴식', pic:'shield', th:'th-purple'},
  law: {t:'관련 법적 근거', s:'위법행위별 조문과 형량', pic:'scale', th:'th-teal'},
  case:{t:'참고 대응 사례', s:'판결로 확인된 4건', pic:'book', th:'th-brown'}
};
var TABTH = {blue:'th-blue', orange:'th-orange', purple:'th-magenta'};
function situTheme(s){
  if(s.urgent) return 'th-red';
  for(var i=0;i<TABS.length;i++) if(SITU[TABS[i].k].indexOf(s)>=0) return TABTH[TABS[i].c];
  return 'th-navy';
}

function go(view, arg){ closeSheet(); S.view=view; S.arg=(arg===undefined?null:arg); render(); window.scrollTo(0,0); }

/* ══════════ 렌더 ══════════ */
function render(){
  var v=S.view, h='', th='th-navy';
  if(v==='home')        { h=vHome(); }
  else if(v==='situ')   { h=vSitu();  th='th-navy'; }
  else if(v==='situD')  { var s=findSitu(S.arg); th=s?situTheme(s):'th-navy'; h=vSituD(S.arg); }
  else if(v==='help')   { h=vHelp();  th=MAIN.help.th; }
  else if(v==='law')    { h=vLaw();   th=MAIN.law.th; }
  else if(v==='lawD')   { h=vLawD(S.arg); th=MAIN.law.th; }
  else if(v==='case')   { h=vCase();  th=MAIN.case.th; }
  else if(v==='timer')  { h=vTimer(); }
  else if(v==='recs')   { h=vRecs(); }
  else if(v==='report') { h=vReport(); }
  else if(v==='print')  { h=vPrint(); }
  var app=$('app');
  app.className=th;
  app.innerHTML = h + livePill();
  bind();
  if(v==='home'){ eqTiles(); bindInstall(); }
  if(v==='timer' && S.startAt) startTick(); else stopTick();
  pillRun();
  updTopTitle();
}

/* v1.4.1 상단바 제목 전환 — 색 띠의 제목(h2)이 상단바 아래로 들어가면 켬 */
function updTopTitle(){
  var tb=document.querySelector('.topbar.swt'); if(!tb) return;
  var h=document.querySelector('.band h2');
  var on=!!h && h.getBoundingClientRect().bottom <= tb.getBoundingClientRect().bottom + 1;
  if(tb.classList.contains('scrolled')!==on) tb.classList.toggle('scrolled', on);
}
var _ttRaf=0;
function onTTScroll(){ if(_ttRaf) return; _ttRaf=requestAnimationFrame(function(){ _ttRaf=0; updTopTitle(); }); }
window.addEventListener('scroll', onTTScroll, {passive:true});
window.addEventListener('resize', onTTScroll);

/* 메인 타일: 같은 줄 두 타일의 부제 높이를 맞춰 제목 높이 정렬 (부제가 둘 다 1줄이면 빈 줄 없음) */
function eqTiles(){
  [['m-situ','m-help'],['m-law','m-case']].forEach(function(r){
    var a=r.map(function(id){ var t=$(id); return t && t.querySelector('small'); });
    if(!a[0]||!a[1]) return;
    a.forEach(function(s){ s.style.minHeight=''; });
    var h=Math.max(a[0].offsetHeight,a[1].offsetHeight);
    a.forEach(function(s){ s.style.minHeight=h+'px'; });
  });
}
window.addEventListener('resize', function(){ if(S.view==='home') eqTiles(); });

/* 통화 중일 때만 뜨는 작은 표시 (하단바 대체) */
function livePill(){
  if(!S.startAt || S.view==='timer') return '';
  return '<button class="livepill" id="livepill"><i></i>통화 중 <span id="pilltime">'+mmss(Date.now()-S.startAt)+'</span></button>';
}
function pillRun(){
  if(S.pillTick){ clearInterval(S.pillTick); S.pillTick=null; }
  if(!S.startAt || S.view==='timer') return;
  S.pillTick=setInterval(function(){
    var e=$('pilltime'); if(e && S.startAt) e.textContent=mmss(Date.now()-S.startAt);
  },1000);
}

/* ── 홈 ── */
function vHome(){
  function tile(id, m){
    return '<button class="mtile '+m.th+'" id="'+id+'">' +
      visual(m.pic) +
      '<span class="tt"><b>'+m.t+'</b><small>'+m.s+'</small></span></button>';
  }
  return '' +
  '<div class="brandbar">' +
    '<span class="brandapp">특이민원 원터치 대응</span>' +
    '<span class="brandorg"><img class="govmark" src="'+GOV_MARK+'" alt="">대구지방고용노동청</span>' +
  '</div>' +
  '<div class="hero">' +
    '<button class="setbtn" id="m-set" aria-label="설정">'+ic('gear')+'<span>설정</span></button>' +
    '<h2>지금 바로 실행하세요.</h2>' +
    '<p>혼자 고민하지 않도록,<br>멘트부터 절차까지 앱이 챙겨드립니다.</p>' +
  '</div>' +
  '<div class="grid">' +
    tile('m-situ', MAIN.situ) + tile('m-help', MAIN.help) +
    tile('m-law', MAIN.law)   + tile('m-case', MAIN.case) +
  '</div>' +
  installCard() +
  '<button class="hlink" id="m-print">'+ic('print')+'인쇄 · PDF 저장<span class="arrow">\u203A</span></button>' +
  '<div class="foot">근거자료 「특이민원 예방 및 대응요령」<br>(2025. 8., 고용노동부 민원운영팀)</div>';
}

/* ── 위기 상황 대응 (목록) ── */
function vSitu(){
  var k=S.tab||'phone', cur=null;
  for(var i=0;i<TABS.length;i++) if(TABS[i].k===k) cur=TABS[i];
  var tabs = TABS.map(function(t){
    return '<button class="stab '+TABTH[t.c]+(t.k===k?' on':'')+'" data-stab="'+t.k+'">'+ic(t.pic)+t.n+'</button>';
  }).join('');
  var rows = SITU[k].map(function(s){
    return '<button class="srow '+(s.urgent?'urgent':TABTH[cur.c])+'" data-situ="'+s.id+'">' +
      '<span class="pic">'+ic(s.pic)+'</span>' +
      '<span class="tx"><b>'+s.t+'</b><small>'+s.s+'</small></span>' +
      '<span class="arrow">\u203A</span></button>';
  }).join('');

    '<div class="stabs">'+tabs+'</div>' +

function findSitu(id){
  var ks=['phone','visit','etc'];
  for(var i=0;i<ks.length;i++){ var a=SITU[ks[i]]; for(var j=0;j<a.length;j++) if(a[j].id===id) return a[j]; }
  return null;
}

/* 전화기 패널: 색상 전환 + 사진 + 강조 링 + 기능버튼 칩 */
function phonePanel(keys, active){

    '<button data-ph="w" class="'+(c==='w'?'on':'')+'">흰색 전화기</button>' +
    '<button data-ph="b" class="'+(c==='b'?'on':'')+'">검정 전화기</button></div>';
  var chips = keys.length ? '<div class="kchips">' + keys.map(function(k){
    var K=keyByNum(k);
    return '<button class="kchip'+(k===active?' on':'')+'" data-kc="'+k+'"><b>'+K.n+'</b>'+K.t+'</button>';
  }).join('') + '</div>' : '';
  return '<div class="ppanel">'+tog+phoneShot(c, active?[active]:[])+chips+'</div>';
}

function vSituD(id){

    '<div class="band"><span class="bic">'+ic(s.pic)+'</span><div><h2>'+s.t+'</h2><p>'+s.s+'</p></div></div>';

  if(s.id==='p5'){
    return head + '<div class="wrap">' +
      phonePanel([], S.hiKey) +
      '<div class="note">기종에 따라 버튼 배치가 다릅니다. <b>본인 전화기에서 미리 확인</b>해 두세요.</div>' +
      KEYS.map(function(k){
        return '<button class="keyrow'+(S.hiKey===k.k?' on':'')+'" data-key="'+k.k+'"><span class="n">'+k.n+'</span>' +
          '<span class="tx"><b>'+k.t+'</b><small>'+k.d+'</small></span></button>';
      }).join('') +
      '<div class="foot" style="padding-top:0.375rem">근거 · 대응요령 9쪽</div>' +
    '</div>';
  }

  if(s.evict){
    return head + '<div class="wrap">' +
      '<div class="art"><h3>퇴거 및 출입제한</h3><ul>' +

      '</ul><div class="src">근거 · 대응요령 12쪽</div></div>' +
      '<div class="art"><h3>안내문 게시</h3><ul>' +
      '<li>민원실 내부와 출입문에 금지행위와 조치사항 안내문을 게시해 <b>사전 고지</b>해야 합니다.</li>' +
      '<li>사전 고지가 없으면 퇴거 조치의 근거가 약해집니다.</li>' +
      '</ul><div class="src">근거 · 대응요령 12쪽</div></div>' +
      '<div class="note warnbox"><b>실무상 한계를 알아 두세요</b><br>' +
      '관공서는 일반적으로 개방된 장소라 퇴거 요청에 단순 불응한 것만으로는 처벌이 어렵습니다. ' +

    '</div>';
  }

/* ── 직원 보호·지원 ── */
function vHelp(){

    '<div class="wrap"><div class="hhead"><span class="hi">'+ic(cur.pic)+'</span><b>'+cur.n+'</b></div>'+HELP[k].body+'</div>';

/* ── 관련 법적 근거 ── */

function vLaw(){
  return '<div class="topbar"><button class="back" id="back">\u2039</button><h1>'+MAIN.law.t+'</h1></div>' +
    '<div class="wrap">' +
      LAW.map(function(L){

var PR = {

    '</div>';

/* ── 참고 대응 사례 ── */
function vCase(){
  return '<div class="topbar"><button class="back" id="back">\u2039</button><h1>'+MAIN.case.t+'</h1></div>' +

function repDirty(){
  if(!R) return false;
  return !!(R.when||R.place||R.dur||R.task||R.words||R.witness||R.acts.length||R.ev.length||
            R.steps.length||R.want.length||R.q1||R.q2||R.q3);
}
/* 하단 선택 시트 — #app 밖에 붙여 다시 그리기에 영향받지 않음 */

/* ══════════ 이벤트 ══════════ */
function bind(){
  var v=S.view;

  var b=$('back');
  if(b) b.onclick=function(){
    if(v==='recs'){ go('timer'); return; }
    if(v==='situD'){ go('situ'); return; }
    if(v==='lawD'){ if(S.from==='situD'){ S.from=null; go('situD', S.lastSitu); } else go('law'); return; }
    if(v==='timer' && S.lastSitu){ go('situD', S.lastSitu); return; }
    if(v==='report' && S.step>1 && S.step<=6){ saveStep(); S.step--; render(); window.scrollTo(0,0); return; }
    if(v==='report' && S.step>6){ S.step=6; render(); window.scrollTo(0,0); return; }
    if(v==='report'){ saveStep(); if(S.lastSitu){ go('situD', S.lastSitu); return; } }
    go('home');
  };

  var m;
  if((m=$('m-situ')))  m.onclick=function(){ go('situ'); };
  if((m=$('m-help')))  m.onclick=function(){ go('help'); };
  if((m=$('m-law')))   m.onclick=function(){ go('law'); };
  if((m=$('m-case')))  m.onclick=function(){ go('case'); };
  if((m=$('m-print'))) m.onclick=function(){ go('print'); };
  if((m=$('m-set')))   m.onclick=openSettings;
  if((m=$('livepill')))m.onclick=function(){ if(S.view==='report' && S.step<=6) saveStep(); go('timer'); };

  each('[data-stab]', function(el){ el.onclick=function(){ S.tab=el.getAttribute('data-stab'); render(); window.scrollTo(0,0); }; });
  each('[data-htab]', function(el){ el.onclick=function(){ S.tab2=el.getAttribute('data-htab'); render(); window.scrollTo(0,0); }; });
  each('[data-situ]', function(el){ el.onclick=function(){ S.lastSitu=el.getAttribute('data-situ'); S.kact=null; S.hiKey=null; go('situD', S.lastSitu); }; });
  each('[data-law]',  function(el){ el.onclick=function(){ S.from=S.view; go('lawD', +el.getAttribute('data-law')); }; });
  each('[data-copy]', function(el){ el.onclick=function(){ copyText(el.getAttribute('data-copy')); }; });

  // 전화기 색상 전환 — 선택을 기억
  each('[data-ph]', function(el){ el.onclick=function(){
    S.phone=el.getAttribute('data-ph'); store.set('sm_phone', S.phone);
    var y=window.scrollY; render(); window.scrollTo(0,y);
  }; });
  // 상황 화면 기능버튼 칩
  each('[data-kc]', function(el){ el.onclick=function(){
    S.kact=+el.getAttribute('data-kc'); var y=window.scrollY; render(); window.scrollTo(0,y);
  }; });
  // 전화기 화면 기능버튼 목록 — 사진이 보이도록 위로
  each('[data-key]', function(el){ el.onclick=function(){
    var k=+el.getAttribute('data-key'); S.hiKey=(S.hiKey===k)?null:k;
    render(); window.scrollTo(0,0);
  }; });

  var stm=$('s-timer'); if(stm) stm.onclick=function(){ go('timer'); };
  var srp=$('s-report');
  if(srp) srp.onclick=function(){
    var s=findSitu(S.arg);
    function fresh(){
      R=newReport();
      if(s){
        R.acts=s.rep.slice();
        if(SITU.phone.indexOf(s)>=0) R.route='전화';
        else if(SITU.visit.indexOf(s)>=0) R.route='대면';
        else R.route='온라인·문자';
        var r=getRecs()[0];
        if(r && R.route==='전화'){ R.when=toLocalInput(r.start); R.dur=durText(r.dur); }
      }
      S.step=1; go('report'); toast('상황 정보를 옮겼습니다');
    }
    if(!repDirty()){ fresh(); return; }
    // 작성하던 내용이 있으면 덮어쓰기 전에 물어봄 (v1.1 결함 수정)
    var far = Math.max(S.maxStep||1, S.step||1);
    var where = far>6 ? '정리본 출력까지 완료' : (far+' / 6단계까지 작성');
    var hint = [R.place, R.acts.length? R.acts.slice(0,2).join('·')+(R.acts.length>2?' 외':'') : ''].filter(Boolean).join(' · ');
    showSheet('작성하던 내용이 있습니다', where+(hint?'<br><span class="sh-h">'+esc(hint)+'</span>':''), [
      {t:'이어서 작성', cls:'btn-main', fn:function(){ S.step=far; go('report'); }},
      {t:'새로 작성 (기존 내용 삭제)', cls:'btn-line', fn:fresh}
    ]);
  };

  // 타이머
  var st=$('start');
  if(st) st.onclick=function(){ S.startAt=Date.now(); S.abuse=false; if(S.keepOn) wakeOn(); render(); };
  var rc=$('recs'); if(rc) rc.onclick=function(){ go('recs'); };
  var ab=$('abuse'); if(ab) ab.onclick=function(){ S.abuse=true; buzz(120); render(); };
  var kp=$('keep'); if(kp) kp.onclick=function(){ S.keepOn=!S.keepOn; if(S.keepOn && S.startAt) wakeOn(); else wakeOff(); render(); };
  var sp=$('stop');
  if(sp) sp.onclick=function(){
    var end=Date.now(), dur=end-S.startAt;
    var why = S.abuse ? 'abuse' : (dur>=LIMIT_MIN*60000 ? 'time' : 'norm');
    addRec({start:S.startAt, end:end, dur:dur, why:why});
    S.startAt=null; S.abuse=false; wakeOff(); stopTick();
    go('recs'); toast('통화 기록을 저장했습니다');
  };

  // 인쇄
  var pc=$('pm-card'); if(pc) pc.onclick=function(){ S.pmode='card'; render(); window.scrollTo(0,0); };
  var pf=$('pm-full'); if(pf) pf.onclick=function(){ S.pmode='full'; render(); window.scrollTo(0,0); };
  var dp=$('doprint'); if(dp) dp.onclick=function(){ window.print(); };

  if(v==='report') bindReport();
}
function each(sel, fn){ var n=document.querySelectorAll(sel); for(var i=0;i<n.length;i++) fn(n[i]); }
function buzz(p){ if(navigator.vibrate){ try{ navigator.vibrate(p); }catch(e){} } }

document.addEventListener('visibilitychange', function(){
  if(document.visibilityState==='visible'){
    if(S.view==='timer' && S.startAt) startTick();
    if(S.keepOn && S.startAt && !S.wakeLock) wakeOn();
    pillRun();
  } else { stopTick(); if(S.pillTick){ clearInterval(S.pillTick); S.pillTick=null; } }
});

/* ── 유틸 ── */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function pad(n){ return n<10 ? '0'+n : ''+n; }
function hhmm(ms){ var d=new Date(ms); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function ymd(ms){ var d=new Date(ms); return (d.getMonth()+1)+'월 '+d.getDate()+'일'; }
function mmss(ms){
  var t=Math.max(0,Math.floor(ms/1000));
  return pad(Math.floor(t/60))+':'+pad(t%60);
}
function durText(ms){
  var t=Math.floor(ms/1000), m=Math.floor(t/60), s=t%60;
  return m+'분 '+s+'초';
}
function toast(msg){
  var el=$('toast'); el.textContent=msg; el.className='toast on';
  clearTimeout(toast._t); toast._t=setTimeout(function(){ el.className='toast'; },1900);
}
function copyText(t){
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(t).then(function(){ toast('복사했습니다'); },function(){ fallbackCopy(t); });
  } else { fallbackCopy(t); }
}
function fallbackCopy(t){
  try{
    var ta=document.createElement('textarea');
    ta.value=t; ta.setAttribute('readonly','');
    ta.style.position='fixed'; ta.style.top='-9999px';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,ta.value.length);
    document.execCommand('copy'); document.body.removeChild(ta);
    toast('복사했습니다');
  }catch(e){ toast('복사할 수 없습니다'); }
}

/* ── 기록 ── */
function getRecs(){
  try{ return JSON.parse(store.get('sm_recs')||'[]'); }catch(e){ return []; }
}
function addRec(r){
  var list=getRecs(); list.unshift(r);
  if(list.length>50) list=list.slice(0,50);
  store.set('sm_recs', JSON.stringify(list));
}

/* ── 화면 유지(Wake Lock) ── */
function wakeSupported(){ return ('wakeLock' in navigator); }
function wakeOn(){
  if(!wakeSupported()) return;
  navigator.wakeLock.request('screen').then(function(l){
    S.wakeLock=l;
    l.addEventListener('release',function(){ S.wakeLock=null; });
  }).catch(function(){ /* 배터리 절약 모드 등에서 거부될 수 있음 */ });
}
function wakeOff(){
  if(S.wakeLock){ try{ S.wakeLock.release(); }catch(e){} S.wakeLock=null; }
}

/* 전화기 사진 + 번호 링 오버레이 */
function phoneShot(color, hi){
  var ring='', spot='';
  for(var i=0;i<KEYS.length;i++){
    var K=KEYS[i]; if(!hi || hi.indexOf(K.k)<0) continue;
    var p=(color==='w'?K.w:K.b), at='circle at '+p[0]+'% '+p[1]+'%';
    // 해당 번호만 밝게 남기고 주변을 어둡게 (번호 간격이 좁아도 헷갈리지 않도록)
    spot = '<span class="spot" style="background:radial-gradient('+at+',transparent 11px,rgba(12,18,30,.42) 13px);' +
           'background:radial-gradient('+at+',transparent 3.3cqw,rgba(12,18,30,.42) 3.9cqw)"></span>';
    ring += '<span class="ring" style="left:'+p[0]+'%;top:'+p[1]+'%"></span>';
  }
  return '<div class="shot"><img src="'+PHONE[color]+'" alt="'+(color==='w'?'흰색':'검정')+' 전화기 기능버튼 위치">'+spot+ring+'</div>';
}

function vTimer(){
  var running = !!S.startAt;
  var head='<div class="topbar"><button class="back" id="back">‹</button><h1>통화 타이머</h1></div>';
  if(!running){
    return head +
    '<div class="stage stage-idle">' +
      '<div class="clock">00:00</div>' +
      '<div class="since">통화를 시작할 때 아래 버튼을 눌러 주세요</div>' +
    '</div>' +
    '<div class="wrap">' +
      '<button class="btn btn-main" id="start">통화 시작</button>' +
      '<div class="note">다른 앱을 쓰거나 화면을 꺼도 시간은 그대로 흘러갑니다. ' +
      '다만 앱을 보고 있지 않으면 15분·20분 알림은 울리지 않습니다.</div>' +
      '<button class="btn btn-line" id="recs">지난 통화 기록</button>' +
    '</div>';
  }

  var el = Date.now() - S.startAt;
  var min = el/60000;
  var stage = S.abuse ? 'over' : (min>=LIMIT_MIN ? 'over' : (min>=WARN_MIN ? 'warn' : 'run'));
  var label = S.abuse ? '폭언 발생 · 즉시 종료 가능'
            : (stage==='over' ? '20분 경과 · 종결 가능'
            : (stage==='warn' ? '15분 경과 · 종료 예고 시점' : '상담 진행 중'));
  var pct = Math.min(100, (el/(LIMIT_MIN*60000))*100);

  var say='';
  if(S.abuse){
    say = sayCard('end','지금 이렇게 말씀하세요',
      '선생님, 계속해서 욕설(폭언)을 하시면 원활한 상담이 어렵습니다. 욕설을 중단하지 않으시면 통화를 종료하겠습니다.') +
      sayCard('end','계속되면',
      '안내해 드린 바와 같이 폭언이 지속되어 상담을 더 이상 진행할 수 없으므로 통화를 종료합니다.');
  } else if(stage==='over'){
    say = sayCard('end','지금 이렇게 말씀하세요',
      '선생님, 통화 시간이 20분을 초과하여 부득이하게 상담을 종료하겠습니다. 추가 문의는 국민신문고 등을 이용해 주시기 바랍니다.');
  } else if(stage==='warn'){
    say = sayCard('warn','지금 이렇게 말씀하세요',
      '선생님, 통화 시간이 15분이 경과되어 다른 민원 상담이 지연되고 있습니다. 상담 권장 시간인 20분이 되면 통화를 종료해야 하니 양해 부탁드립니다.');
  } else {
    say = '';
  }

  return head +
  '<div class="stage stage-'+stage+'" id="stage">' +
    '<div class="label" id="label">'+label+'</div>' +
    '<div class="clock" id="clock">'+mmss(el)+'</div>' +
    '<div class="since">'+hhmm(S.startAt)+' 시작</div>' +
    '<div class="track"><i id="bar" style="width:'+pct+'%"></i></div>' +
    '<div class="ticks"><span>0분</span><span>'+WARN_MIN+'분</span><span>'+LIMIT_MIN+'분</span></div>' +
  '</div>' +
  '<div class="wrap">' +
    '<div id="sayzone">'+say+'</div>' +
    keepRow() +
    (S.abuse ? '' : '<button class="btn btn-warnline" id="abuse">폭언·성희롱이 있었습니다</button>') +
    '<button class="btn btn-stop" id="stop">통화 종료</button>' +
  '</div>';
}
function sayCard(kind,cap,text){
  return '<div class="say '+kind+'"><div class="cap">'+cap+'</div>' +
    '<div class="q">'+esc(text)+'</div>' +
    '<button class="copy" data-copy="'+esc(text)+'">문구 복사</button></div>';

function keepRow(){
  if(!wakeSupported()){
    return '<div class="note">이 기기는 화면 유지 기능을 지원하지 않습니다. 화면이 꺼져도 시간은 정상적으로 흘러갑니다.</div>';
  }
  return '<div class="keep" id="keep">' +
    '<span class="tx"><b>화면 켜둔 채 사용</b><small>책상에 두고 통화할 때 · 배터리를 더 씁니다</small></span>' +
    '<span class="sw'+(S.keepOn?' on':'')+'"><i></i></span></div>';

function startTick(){
  stopTick();
  S.tick=setInterval(paint,1000);
  paint();
}
function stopTick(){ if(S.tick){ clearInterval(S.tick); S.tick=null; } }

function paint(){
  if(S.view!=='timer' || !S.startAt) return;
  var c=$('clock'); if(!c) return;
  var el=Date.now()-S.startAt, min=el/60000;
  c.textContent=mmss(el);
  var bar=$('bar'); if(bar) bar.style.width=Math.min(100,(el/(LIMIT_MIN*60000))*100)+'%';

  var stage = S.abuse ? 'over' : (min>=LIMIT_MIN ? 'over' : (min>=WARN_MIN ? 'warn' : 'run'));
  var st=$('stage');
  if(st && st.className.indexOf('stage-'+stage)<0){
    // 단계가 바뀌는 순간에만 전체를 다시 그림
    if(navigator.vibrate){ try{ navigator.vibrate([180,90,180]); }catch(e){} }
    render();
  }
}

function typeHint(){
  var t=classify();
  if(!t.ill && !t.unfair) return '';
  return '<div class="note"><b>선택하신 내용은 이렇게 분류됩니다</b><br>' +
    (t.ill ? '<span class="tag tag-illegal">위법민원</span>'+t.illG.join(', ')+'<br>' : '') +
    (t.unfair ? '<span class="tag tag-unfair">부당민원</span>'+t.unfairG.join(', ') : '') +
    '</div>';
}
function classify(){
  var illG=[], unfairG=[];
  for(var i=0;i<ACTS.length;i++){
    var a=ACTS[i];
    if(R.acts.indexOf(a.k)<0) continue;
    var arr = a.ill ? illG : unfairG;
    if(arr.indexOf(a.g)<0) arr.push(a.g);
  }
  return {ill:illG.length>0, unfair:unfairG.length>0, illG:illG, unfairG:unfairG};
}

/* ── 발생 경위 정리 출력 ── */
function buildReport(){
  var t=classify(), L=[];
  var typeLine=[];
  if(t.ill) typeLine.push('위법민원 - '+t.illG.join(', '));
  if(t.unfair) typeLine.push('부당민원 - '+t.unfairG.join(', '));

  L.push('특이민원 발생 경위 정리(참고용)');
  L.push('');
  L.push('1. 발생 개요');
  L.push(' ○ 일  시: '+fmtWhen(R.when)+(R.dur?' (총 '+R.dur+')':''));
  L.push(' ○ 장  소: '+(R.place||'(입력 필요)'));
  L.push(' ○ 경  로: '+(R.route||'(입력 필요)'));
  L.push(' ○ 유  형: '+(typeLine.length?typeLine.join(' / '):'(입력 필요)'));
  L.push('');
  L.push('2. 발생 경위');
  L.push(' ○ 당시 처리 중이던 업무: '+(R.task||'(입력 필요)'));
  L.push(' ○ 민원인의 언동');
  var w=(R.words||'(입력 필요)').split('\n');
  for(var i=0;i<w.length;i++) if(w[i].trim()) L.push('  - '+w[i].trim());
  L.push('');
  L.push('3. 공무집행방해 요건 관련 사실관계');
  L.push(' ○ 적법한 공무집행 중이었는지: '+(R.q1||'미확인')+(R.q1==='예'&&R.task?' ('+R.task+')':''));
  L.push(' ○ 폭행 또는 협박이 있었는지: '+(R.q2||'미확인'));
  L.push(' ○ 공무집행이 방해되었는지: '+(R.q3||'미확인'));
  L.push(' ※ 위 항목은 사실관계 정리용이며, 죄명 및 성립 여부 판단은 수사기관과 법률자문 소관임');
  L.push('');
  L.push('4. 증거 확보 현황');
  if(R.ev.length) for(var j=0;j<R.ev.length;j++) L.push(' ○ '+R.ev[j]);
  else L.push(' ○ (확보한 증거 없음)');
  if(R.witness) L.push(' ○ 목격자: '+R.witness);
  L.push('');
  L.push('5. 조치사항');
  if(R.steps.length) for(var k=0;k<R.steps.length;k++) L.push(' ○ '+R.steps[k]);
  else L.push(' ○ (조치사항 입력 필요)');
  L.push('');
  L.push('6. 요청사항');
  if(R.want.length) for(var m=0;m<R.want.length;m++) L.push(' ○ '+R.want[m]);
  else L.push(' ○ (요청사항 입력 필요)');
  L.push('');
  L.push('※ 「특이민원 예방 및 대응요령」(2025. 8.)을 참고해 정리함');
  return L.join('\n');
}

    if(v==='예') return '<span class="m yes">●</span>';
    if(v==='아니오') return '<span class="m no">○</span>';
    return '<span class="m idk">△</span>';
  };
  var next = R.want.indexOf('법률지원 검토')>=0 ?
    '<div class="art"><h3>다음 절차</h3><ul>' +

      '<li><b>청별 법률자문단</b>은 청·대표지청 특이민원 담당자에게 전화·메일로 바로 신청할 수 있습니다.</li>' +
      '<li>피소된 경우 <b>공무원 책임보험</b> 사고접수 전 문의는 1544-3025입니다.</li>' +
    '</ul><div class="src">근거 · 대응요령 7쪽, 15쪽, 17쪽, 19쪽</div></div>' : '';

      '<div class="chk">'+mark(R.q2)+'<span>폭행 또는 협박이 있었는지</span></div>' +
      '<div class="chk">'+mark(R.q3)+'<span>공무집행이 방해되었는지</span></div>' +
      '<div class="src">이 표는 사실관계 정리용입니다. 죄가 되는지는 수사기관과 법률자문이 판단합니다.</div>' +
    '</div>' +

    next +

  '</div>';
}

/* ── 보고서 입력 저장 ── */
function saveStep(){
  function v(id){ var e=$(id); return e ? e.value : null; }
  var x;
  if((x=v('f-when'))!==null) R.when=x;
  if((x=v('f-place'))!==null) R.place=x;
  if((x=v('f-dur'))!==null) R.dur=x;
  if((x=v('f-task'))!==null) R.task=x;
  if((x=v('f-words'))!==null) R.words=x;
  if((x=v('f-wit'))!==null) R.witness=x;
}
function bindReport(){
  // 칩(다중/단일 선택) — 다시 그리지 않고 상태만 바꿔 입력 포커스를 지킴
  var groups=[{id:'c-route',key:'route',single:true},{id:'c-acts',key:'acts'},
              {id:'c-ev',key:'ev'},{id:'c-steps',key:'steps'},{id:'c-want',key:'want'}];
  groups.forEach(function(g){
    var box=$(g.id); if(!box) return;
    var chips=box.querySelectorAll('.chip');
    for(var i=0;i<chips.length;i++){
      chips[i].onclick=(function(el){ return function(){
        var val=el.getAttribute('data-chip');
        if(g.single){
          for(var j=0;j<chips.length;j++) chips[j].className='chip';
          el.className='chip on'; R[g.key]=val;
        } else {
          var arr=R[g.key], p=arr.indexOf(val);
          if(p>=0){ arr.splice(p,1); el.className='chip'; }
          else { arr.push(val); el.className='chip on'; }
          if(g.id==='c-acts'){ saveStep(); render(); }   // 분류 안내를 갱신
        }
      }; })(chips[i]);
    }
  });

  // 요건 3문항
  var qs=document.querySelectorAll('[data-q]');
  for(var n=0;n<qs.length;n++){
    (function(box){
      var key=box.getAttribute('data-q');
      var opts=box.querySelectorAll('.opt');
      for(var i=0;i<opts.length;i++){
        opts[i].onclick=(function(el){ return function(){
          for(var j=0;j<opts.length;j++) opts[j].className='opt';
          el.className='opt on'; R[key]=el.getAttribute('data-qv');
        }; })(opts[i]);
      }
    })(qs[n]);
  }

  var lr=$('loadrec');
  if(lr) lr.onclick=function(){
    var r=getRecs()[0]; if(!r) return;
    R.when=toLocalInput(r.start); R.dur=durText(r.dur); R.route='전화';
    render(); toast('통화 기록을 불러왔습니다');
  };

  var nx=$('next');
  if(nx) nx.onclick=function(){ saveStep(); S.step++; render(); window.scrollTo(0,0); };
  var pv=$('prev');
  if(pv) pv.onclick=function(){ saveStep(); S.step--; render(); window.scrollTo(0,0); };

  var co=$('copyout'); if(co) co.onclick=function(){ copyText(buildReport()); };
  var eo=$('editout'); if(eo) eo.onclick=function(){ S.step=1; render(); window.scrollTo(0,0); };
  var cl=$('clearout');
  if(cl) cl.onclick=function(){ R=newReport(); S.step=1; render(); toast('작성 내용을 지웠습니다'); };
}


/* ══════════ 홈 화면 설치 · 서비스워커 · 자동 업데이트 (법ON 방식) ══════════ */
var INST={ev:null};
function isApp(){ try{ return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone===true; }catch(e){ return false; } }
function isIOS(){ var u=navigator.userAgent||''; return /iPhone|iPad|iPod/.test(u) || (/Macintosh/.test(u) && navigator.maxTouchPoints>1); }
function instHidden(){ return store.get('sm_instHide')==='1'; }
/* 홈 화면 안내 카드: 안드로이드(설치 가능할 때) → 설치 버튼 / 아이폰 Safari → 공유 → 홈 화면에 추가 안내 */
function installCard(){
  if(isApp() || instHidden()) return '';
  if(INST.ev) return '<div class="inst"><span class="ii">'+ic('deskphone')+'</span><span class="it"><b>앱으로 설치</b><small>홈 화면에서 바로 실행</small></span>' +
    '<button class="ib" id="inst-go">설치</button><button class="ix" id="inst-x" aria-label="설치 안내 닫기">\u00D7</button></div>';
  if(isIOS()) return '<div class="inst"><span class="ii">'+ic('deskphone')+'</span><span class="it"><b>홈 화면에 추가</b><small>Safari 아래 공유 버튼 \u2192 홈 화면에 추가</small></span>' +
    '<button class="ix" id="inst-x" aria-label="설치 안내 닫기">\u00D7</button></div>';
  return '';
}
function bindInstall(){
  var g=$('inst-go'), x=$('inst-x');
  if(g) g.onclick=function(){ var e=INST.ev; if(!e) return; try{ e.prompt(); }catch(err){}
    var done=function(){ INST.ev=null; if(S.view==='home') render(); };
    if(e.userChoice && e.userChoice.then) e.userChoice.then(done,done); else done(); };
  if(x) x.onclick=function(){ store.set('sm_instHide','1'); render(); };
}
window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); INST.ev=e; if(S.view==='home') render(); });
window.addEventListener('appinstalled', function(){ INST.ev=null; toast('홈 화면에 설치했습니다'); if(S.view==='home') render(); });

/* 자동 업데이트 — GitHub에 새 index.html을 올리면 반영. 통화 타이머·보고서 작성 중에는 절대 새로고침하지 않음 */
var UPD={pending:false, reg:null, last:0};
function idle(){ return !S.startAt && !repDirty() && S.view!=='report'; }
function onUpdated(){ UPD.pending=true; if(document.visibilityState!=='hidden' && idle()) location.reload(); else toast('새 버전이 준비됐습니다. 작업을 마치면 적용됩니다'); }
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1')){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./service-worker.js').then(function(r){ UPD.reg=r; }).catch(function(){});
  });
  navigator.serviceWorker.addEventListener('message', function(e){ if(e.data && e.data.type==='ONETOUCH_UPDATED') onUpdated(); });
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState!=='visible') return;
    if(UPD.pending && idle()){ location.reload(); return; }
    var now=Date.now(); if(UPD.reg && now-UPD.last>60000){ UPD.last=now; try{ UPD.reg.update().catch(function(){}); }catch(e){} }
  });
}

render();
</script>
